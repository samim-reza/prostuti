name: Supabase deploy

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'supabase/**'

concurrency:
  group: supabase-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Migrations & Edge Functions
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Apply migrations
        run: |
          ENC=$(python3 -c "import os,urllib.parse;print(urllib.parse.quote(os.environ['DB_PASSWORD'],safe=''))")
          supabase db push --include-all \
            --db-url "postgresql://postgres.${PROJECT_REF}:${ENC}@aws-0-ap-south-1.pooler.supabase.com:5432/postgres"
      - name: Deploy Edge Functions
        run: supabase functions deploy --project-ref "$PROJECT_REF" --use-api
