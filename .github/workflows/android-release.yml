name: Android release (APK)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-release
  cancel-in-progress: false

jobs:
  build:
    name: Build signed APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: app
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.6
          channel: stable
          cache: true

      - name: Dependencies & localizations
        run: |
          flutter pub get
          dart run tool/l10n_merge.dart
          flutter gen-l10n

      - name: Release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::No keystore secret — APKs will be signed with the debug key"
          fi

      - name: Build APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          # One universal APK (installs on every Android phone).
          # --obfuscate + --split-debug-info: smaller Dart code that is harder to
          # reverse-engineer; symbols are kept as an artifact for crash reports.
          flutter build apk --release --build-number=${{ github.run_number }} \
            --obfuscate --split-debug-info=build/symbols \
            --dart-define=SUPABASE_URL=$SUPABASE_URL --dart-define=SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: *//; s/+.*//')
          echo "APP_VERSION=$VERSION" >> "$GITHUB_ENV"
          mkdir -p ../dist
          cp build/app/outputs/flutter-apk/app-release.apk ../dist/prostuti-v$VERSION-${{ github.run_number }}.apk
          ls -lh ../dist

      - uses: actions/upload-artifact@v4
        with:
          name: prostuti-apk-${{ github.run_number }}
          path: dist/*.apk
          retention-days: 30

      - uses: actions/upload-artifact@v4
        with:
          name: prostuti-debug-symbols-${{ github.run_number }}
          path: app/build/symbols
          retention-days: 90

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.APP_VERSION }}-build.${{ github.run_number }}
          name: Prostuti ${{ env.APP_VERSION }} (build ${{ github.run_number }})
          prerelease: true
          files: dist/*.apk
          body: |
            Test build from `${{ github.sha }}` — install the APK on any Android phone (Android 7.0+).

            Commit: ${{ github.event.head_commit.message }}
