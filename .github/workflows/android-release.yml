name: Android release (APK)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-release
  cancel-in-progress: false

jobs:
  build:
    name: Build signed APKs
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: app
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.6
          channel: stable
          cache: true

      - name: Dependencies & localizations
        run: |
          flutter pub get
          dart run tool/l10n_merge.dart
          flutter gen-l10n

      - name: Release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::No keystore secret — APKs will be signed with the debug key"
          fi

      - name: Build APKs
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          DEFINES="--dart-define=SUPABASE_URL=$SUPABASE_URL --dart-define=SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY"
          flutter build apk --release --split-per-abi --build-number=${{ github.run_number }} $DEFINES
          flutter build apk --release --build-number=${{ github.run_number }} $DEFINES
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: *//; s/+.*//')
          echo "APP_VERSION=$VERSION" >> "$GITHUB_ENV"
          mkdir -p ../dist
          cd build/app/outputs/flutter-apk
          cp app-release.apk             ../../../../../dist/prostuti-v$VERSION-${{ github.run_number }}-universal.apk
          cp app-arm64-v8a-release.apk   ../../../../../dist/prostuti-v$VERSION-${{ github.run_number }}-arm64-v8a.apk
          cp app-armeabi-v7a-release.apk ../../../../../dist/prostuti-v$VERSION-${{ github.run_number }}-armeabi-v7a.apk
          cp app-x86_64-release.apk      ../../../../../dist/prostuti-v$VERSION-${{ github.run_number }}-x86_64.apk
          ls -lh ../../../../../dist

      - uses: actions/upload-artifact@v4
        with:
          name: prostuti-apk-${{ github.run_number }}
          path: dist/*.apk
          retention-days: 30

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.APP_VERSION }}-build.${{ github.run_number }}
          name: Prostuti ${{ env.APP_VERSION }} (build ${{ github.run_number }})
          prerelease: true
          files: dist/*.apk
          body: |
            Test build from `${{ github.sha }}`.

            **Which APK?** Most phones: `arm64-v8a`. Older 32-bit phones: `armeabi-v7a`.
            Not sure? Install the `universal` APK (larger, works everywhere).

            Commit: ${{ github.event.head_commit.message }}
