name: iOS build check

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app/ios/**'
      - 'app/pubspec.yaml'
      - '.github/workflows/ios-build.yml'

jobs:
  build:
    name: Build iOS (no code signing)
    runs-on: macos-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.6
          channel: stable
          cache: true
      - run: |
          flutter pub get
          dart run tool/l10n_merge.dart
          flutter gen-l10n
      - name: Build
        run: |
          flutter build ios --release --no-codesign \
            --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }} \
            --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}
      - name: Package unsigned app
        run: cd build/ios/iphoneos && zip -qr ../../../Runner-unsigned.zip Runner.app
      - uses: actions/upload-artifact@v4
        with:
          name: prostuti-ios-unsigned-${{ github.run_number }}
          path: app/Runner-unsigned.zip
          retention-days: 14
