name: prostuti
description: "Prostuti (প্রস্তুতি) — job exam preparation for Bangladesh"
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  supabase_flutter: ^2.18.0
  flutter_riverpod: ^3.4.3
  go_router: ^18.0.2
  hive_ce: ^2.20.1
  hive_ce_flutter: ^2.4.0
  cached_network_image: ^4.0.4
  flutter_image_compress: ^2.5.1
  image_picker: ^1.2.3
  google_mobile_ads: ^9.1.0
  flutter_local_notifications: ^22.3.1
  timezone: ^0.11.1
  flutter_timezone: ^5.1.1
  firebase_core: ^4.15.0
  firebase_messaging: ^16.7.0
  pdf: ^3.13.1
  printing: ^5.15.1
  path_provider: ^2.1.6
  share_plus: ^13.3.1
  intl: ^0.20.3
  flutter_svg: ^2.3.0
  shimmer: ^4.0.0
  timeago: ^3.7.1
  url_launcher: ^6.3.3
  equatable: ^2.1.0
  collection: ^1.19.1
  crypto: ^3.0.7
  uuid: ^4.6.0
  connectivity_plus: ">=7.0.0 <7.3.2"
  package_info_plus: ^10.2.2
  fl_chart: ^1.2.0
  photo_view: ^0.15.0
  flutter_localizations:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8
  very_good_analysis: ^11.0.0
  mocktail: ^1.0.5

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/
    - assets/illustrations/

  fonts:
    - family: HindSiliguri
      fonts:
        - asset: assets/fonts/HindSiliguri-Regular.ttf
          weight: 400
        - asset: assets/fonts/HindSiliguri-Medium.ttf
          weight: 500
        - asset: assets/fonts/HindSiliguri-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/HindSiliguri-Bold.ttf
          weight: 700
