include: package:very_good_analysis/analysis_options.yaml

formatter:
  page_width: 120

analyzer:
  exclude:
    - lib/l10n/gen/**
    - "**/*.g.dart"
    - build/**
    - android/**
    - ios/**
    - web/**
  language:
    strict-casts: true
    strict-raw-types: true
  errors:
    # Bangla UI copy and data-driven JSON make these noisy without adding safety.
    avoid_dynamic_calls: ignore

linter:
  rules:
    public_member_api_docs: false
    lines_longer_than_80_chars: false
    sort_pub_dependencies: false
    flutter_style_todos: false
    avoid_positional_boolean_parameters: false
    document_ignores: false
    no_default_cases: false
    prefer_int_literals: false
    # Dart 3.13 "new"-style constructor syntax is still unfamiliar to most
    # contributors; keep the classic ClassName(...) constructors.
    unnecessary_type_name_in_constructor: false
    specify_nonobvious_property_types: false
    async_return_with_no_await: false
    use_build_context_synchronously: true
    unawaited_futures: true
